name: school_app
description: "SchoolMaster — AI Study Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  phosphoricons_flutter: ^1.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-500.ttf
          weight: 500
        - asset: assets/fonts/Oswald-600.ttf
          weight: 600
        - asset: assets/fonts/Oswald-700.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-700.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: Barlow
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowSemiCondensed-ExtraBold.ttf
          weight: 800
